# ============================================================================
# AyudaYa Frontend - Configuración de Nginx
#
# El Dockerfile copia este archivo en /etc/nginx/conf.d/default.conf,
# por eso contiene un bloque "server" completo usando el puerto 80.
# El nginx.conf principal de la imagen ya incluye este directorio.
# ============================================================================

server {
    listen       80;
    server_name  _;

    # Raíz donde se copió la app compilada (ver Dockerfile)
    root  /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para acelerar la carga de assets
    gzip             on;
    gzip_comp_level  5;
    gzip_min_length  256;
    gzip_proxied     any;
    gzip_types       text/plain text/css application/javascript application/json
                     image/svg+xml;

    # ---------------------------------------------------------------------
    # Enrutado SPA (Single Page Application)
    # ---------------------------------------------------------------------
    # Si la ruta solicitada no es un archivo físico ni un directorio,
    # se sirve index.html y Angular resuelve la ruta del lado del cliente.
    # Evita los errores 404 al recargar (F5) rutas como /login o /perfil.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------
    # Cache de assets con hash (Angular usa outputHashing: all en producción:
    # main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css, etc.)
    # ---------------------------------------------------------------------
    # Como los nombres incluyen hash de contenido, es seguro cachear 1 año.
    location ~* \.(?:css|js|json|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|map)$ {
        expires    1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------
    # index.html NUNCA debe cachearse: es el punto de entrada que apunta
    # a los bundles versionados; si se cachea, los usuarios verían versiones
    # antiguas de la app tras cada despliegue.
    # ---------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires    -1;
    }
}
