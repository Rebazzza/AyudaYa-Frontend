<div class="max-w-xl mx-auto px-4 py-8">
  <a routerLink="/" class="text-brand-orange hover:underline text-sm mb-4 inline-block">&larr; Volver a locales</a>

  <div class="bg-white rounded-xl shadow-md p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Registrar nuevo local</h1>

    @if (error()) {
      <div class="bg-red-50 text-red-600 text-sm rounded-lg px-4 py-3 mb-4">
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del local</label>
        <input
          type="text"
          [(ngModel)]="form.nombreLocal"
          name="nombre"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
        <input
          type="text"
          [(ngModel)]="form.direccionLocal"
          name="direccion"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
        />
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Latitud</label>
          <input
            type="number"
            [(ngModel)]="form.latitud"
            name="latitud"
            required
            step="0.000001"
            placeholder="Ej. -12.046374"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Longitud</label>
          <input
            type="number"
            [(ngModel)]="form.longitud"
            name="longitud"
            required
            step="0.000001"
            placeholder="Ej. -77.042793"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
          />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Capacidad (m³)</label>
        <input
          type="number"
          [(ngModel)]="form.capacidadLocalM3"
          name="capacidad"
          required
          min="0.01"
          step="0.1"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
        <input
          type="text"
          [(ngModel)]="form.telefonoLocal"
          name="telefono"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-orange focus:border-transparent"
        />
      </div>
      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-brand-orange text-white py-2.5 rounded-lg font-semibold hover:bg-brand-hover transition disabled:opacity-50"
      >
        {{ loading() ? 'Registrando...' : 'Registrar local' }}
      </button>
    </form>
  </div>
</div>
